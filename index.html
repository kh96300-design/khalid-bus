<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النظام الإداري الموحد | مدرسة الشيخ جاعد</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        
        body { background-color: #0f172a; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

        /* شريط التنقل العلوي */
        .tab-bar {
            display: flex;
            background: #1e293b;
            padding: 12px 12px 0 12px;
            gap: 8px;
            border-bottom: 3px solid #3b82f6;
            overflow-x: auto;
        }

        .tab-btn {
            padding: 14px 30px;
            border: none;
            background: #334155;
            color: #94a3b8;
            cursor: pointer;
            border-radius: 12px 12px 0 0;
            font-size: 1.15rem; /* تكبير الخط بما يتناسب مع الشاشات */
            font-weight: 700;    /* خط عريض وأكثر تميزاً */
            letter-spacing: 0.5px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 12px; /* مسافة أكبر بين الأيقونة والنص */
            white-space: nowrap;
        }

        /* تكبير حجم الأيقونات داخل الأزرار */
        .tab-btn i { 
            font-size: 1.35rem; 
            transition: transform 0.3s ease;
        }

        /* تأثيرات الألوان والتميز عند التفعيل */
        .tab-btn.active[onclick*="page12"] { 
            background: #8b5cf6; 
            color: white; 
            box-shadow: 0 -4px 12px rgba(139, 92, 246, 0.3); 
        }
        .tab-btn.active[onclick*="page40"] { 
            background: #3b82f6; 
            color: white; 
            box-shadow: 0 -4px 12px rgba(59, 130, 246, 0.3); 
        }

        /* تأثير عند تمرير مؤشر الماوس */
        .tab-btn:hover:not(.active) {
            background: #475569;
            color: #f1f5f9;
        }
        
        .tab-btn:hover i {
            transform: scale(1.15); /* تفاعل ذكي للأيقونة عند الحوم فوقها */
        }

        /* حاوية المحتوى */
        .content-area {
            flex: 1;
            width: 100%;
            position: relative;
            background: #f8fafc;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        iframe.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('page12', this)">
            <i class="fa-solid fa-fingerprint"></i> نظام البصمة (12)
        </button>

        <button class="tab-btn" onclick="switchTab('page40', this)">
            <i class="fa-solid fa-gauge-high"></i> النظام الإداري (40)
        </button>
    </div>

    <div class="content-area">
        <iframe id="page12" src="12.html" class="active" allow="camera; microphone; camera *; geolocation"></iframe>
        <iframe id="page40" src="40.html" allow="camera; geolocation"></iframe>
    </div>

    <script>
        function switchTab(pageId, btn) {
            document.querySelectorAll('iframe').forEach(frame => {
                frame.classList.remove('active');
            });

            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('active');
            });

            const targetFrame = document.getElementById(pageId);
            if (targetFrame) {
                targetFrame.classList.add('active');
                btn.classList.add('active');
            }
        }

        // تسجيل Service Worker للعمل كتطبيق
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('تم تسجيل التطبيق بنجاح!'))
                .catch(err => console.log('فشل التسجيل', err));
            });
        }
    </script>
</body>
</html>
